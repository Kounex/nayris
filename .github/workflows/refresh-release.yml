# From it-env/templates/container-image/release-flows/ (see ../README.md there).
name: refresh release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release even if non-Dependabot commits are unreleased
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Anything to release?
        id: guard
        env:
          FORCE: ${{ inputs.force }}
        run: |
          last=origin/release
          commits=$(git log --format='%H%x09%an' "$last..HEAD")
          # Runs under bash -e -o pipefail: no early-exit pipes (grep -q), use grep -c.
          bots=$(printf '%s\n' "$commits" | cut -f2 | grep -c -x 'dependabot\[bot\]' || true)
          if [ "$FORCE" != true ] && [ "$bots" -eq 0 ]; then
            echo "No Dependabot commits since $last; nothing to refresh."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Unreleased human work = commits not by the bots that change something
          # outside .github/ (CI-only commits don't change what ships).
          unreleased=""
          while IFS=$'\t' read -r sha author; do
            [ -n "$sha" ] || continue
            case "$author" in 'dependabot[bot]'|'github-actions[bot]') continue ;; esac
            outside=$(git diff-tree --no-commit-id --name-only -r "$sha" | grep -c -v '^\.github/' || true)
            if [ "$outside" -gt 0 ]; then unreleased="$unreleased $sha"; fi
          done <<<"$commits"
          if [ "$FORCE" != true ] && [ -n "$unreleased" ]; then
            echo "::notice::Unreleased non-Dependabot commits since $last; ship them with your next normal release."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        if: steps.guard.outputs.go == 'true'
        run: |
          new=$(python3 - <<'PY'
          import re, subprocess
          changed = subprocess.run(['git', 'diff', '--name-only', 'origin/release', 'HEAD'], capture_output=True, text=True).stdout.split()
          out = []
          if any(f.startswith('server/') for f in changed):
              p = 'server/package.json'; s = open(p).read()
              m = re.search(r'"version": "(\d+)\.(\d+)\.(\d+)"', s)
              v = f'{m[1]}.{m[2]}.{int(m[3]) + 1}'
              open(p, 'w').write(s[:m.start()] + f'"version": "{v}"' + s[m.end():]); out.append(f'server {v}')
          if any(f.startswith('client/') for f in changed):
              p = 'client/pubspec.yaml'; s = open(p).read()
              m = re.search(r'^version: (\d+)\.(\d+)\.(\d+)(\+(\d+))?$', s, re.M)
              v = f'{m[1]}.{m[2]}.{int(m[3]) + 1}'
              build = f'+{int(m[5]) + 1}' if m[5] else ''
              open(p, 'w').write(s[:m.start()] + f'version: {v}{build}' + s[m.end():]); out.append(f'client {v}')
          print(', '.join(out) or 'nothing')
          PY
          )
          [ "$new" != nothing ] || { echo "Only files outside client/ and server/ changed; nothing to publish."; exit 1; }
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and publish
        if: steps.guard.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release($VERSION): dependency refresh"
          git push origin HEAD:"$GITHUB_REF_NAME"
          git push origin HEAD:release
          changed=$(git diff --name-only HEAD~1 HEAD)
          if echo "$changed" | grep -q '^server/'; then gh workflow run ci-server.yaml --ref release; fi
          if echo "$changed" | grep -q '^client/'; then gh workflow run ci-client.yaml --ref release; fi
