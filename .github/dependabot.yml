# Base images + npm (server) packages; patch/digest bumps merge and release
# themselves (dependabot-refresh.yml -> refresh-release.yml). The Flutter
# client's pub packages are left to normal development.
# See Kounex/it-env templates/container-image/.
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/client", "/server"]
    schedule:
      interval: weekly
    ignore:
      # Python minor/major and Node major upgrades are deliberate migrations
      # (missing wheels, removed modules, yarn gone from node 25+), not
      # refreshes. Patches and same-tag digests still flow.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/server"
    schedule:
      interval: weekly
    groups:
      patches:
        update-types: ["patch"]
        patterns: ["*"]
    ignore:
      # Majors of these are a planned migration (NestJS 10 -> 11/12 + TypeScript 7 + eslint flat config), not a refresh;
      # see Kounex/it-env templates/container-image/README.md, "Planned migrations".
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
